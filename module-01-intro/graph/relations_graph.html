<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary terms and their usage in the report</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
  --grid: #e4e3df; --explicit: #2a78d6; --implicit: #eb6834; --node: #0b0b0b; --section: #52514e;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --grid: #3a3936; --explicit: #3987e5; --implicit: #d95926; --node: #f0efec; --section: #c3c2b7;
  }
}
body { margin: 0; }
.viz-root { background: var(--surface-1); color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; min-height: 100vh; box-sizing: border-box; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--text-secondary); margin: 0 0 16px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.controls button { font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--grid); background: transparent; color: var(--text-primary); }
.controls button[aria-pressed="true"] { border-color: var(--text-primary); font-weight: 600; }
.legend { display: flex; gap: 16px; color: var(--text-secondary); margin-bottom: 8px; align-items: center; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
svg { width: 100%; max-width: 1000px; height: auto; display: block; }
svg text { fill: var(--text-primary); font-size: 13px; }
svg .muted { fill: var(--text-secondary); }
.edge { fill: none; stroke-linecap: round; opacity: .55; transition: opacity .15s; }
.edge.explicit { stroke: var(--explicit); }
.edge.implicit { stroke: var(--implicit); stroke-dasharray: 6 4; }
.dim .edge { opacity: .06; }
.dim .edge.on { opacity: .9; }
.dim .node:not(.on) { opacity: .3; }
.hit { fill: transparent; cursor: pointer; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; max-width: 280px; }
#tip b { display: block; margin-bottom: 4px; }
#tip .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
table { border-collapse: collapse; margin-top: 16px; font-size: 13px; }
th, td { padding: 4px 10px; border-bottom: 1px solid var(--grid); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 600; }
details summary { cursor: pointer; color: var(--text-secondary); margin-top: 16px; }
</style>
</head>
<body>
<div class="viz-root">
  <h1>Vocabulary terms and their usage in the research report</h1>
  <p class="sub">Each line links a term to a report section where it is used. Line width shows the number of mentions.
  Hover a term or a section to highlight its links.</p>
  <div class="controls" role="group" aria-label="Mention type">
    <button data-mode="both" aria-pressed="true">Explicit + implicit</button>
    <button data-mode="explicit" aria-pressed="false">Explicit only</button>
    <button data-mode="implicit" aria-pressed="false">Implicit only</button>
  </div>
  <div class="legend">
    <span><i style="border-color: var(--explicit)"></i>Explicit mention</span>
    <span><i style="border-color: var(--implicit); border-top-style: dashed"></i>Implicit mention</span>
    <span>Term label: (explicit / implicit)</span>
  </div>
  <svg id="graph" role="img" aria-label="Relationship graph between vocabulary terms and report sections"></svg>
  <details open>
    <summary>Table view</summary>
    <table id="table"></table>
  </details>
  <div id="tip"></div>
</div>
<script>
(() => {
const DATA = {"source": {"report": "../research-report.md", "vocabulary": "../vocabulary.md"}, "method": "Explicit = the term or its direct forms; implicit = synonyms, descriptions or examples of the concept. Explicit matches are masked before implicit counting.", "sections": ["Introduction", "1 Coding assistants", "2 Test generation", "3 Logs & debugging", "4 RAG", "5 Agentic SDLC", "6 Small & local LLMs", "7 Multimodal", "Summary"], "terms": [{"term": "LLM", "explicit_total": 12, "implicit_total": 20, "sections_used": 7, "by_section": {"Introduction": {"explicit": 2, "implicit": 1}, "1 Coding assistants": {"explicit": 1, "implicit": 1}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 1, "implicit": 1}, "4 RAG": {"explicit": 3, "implicit": 0}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 3, "implicit": 14}, "7 Multimodal": {"explicit": 1, "implicit": 3}, "Summary": {"explicit": 1, "implicit": 0}}, "explicit_patterns": ["\\bLLMs?\\b", "\\blarge language models?\\b", "\\blanguage models?\\b"], "implicit_patterns": ["\\bmodels?\\b"]}, {"term": "Attention mechanism", "explicit_total": 1, "implicit_total": 1, "sections_used": 2, "by_section": {"Introduction": {"explicit": 1, "implicit": 0}, "1 Coding assistants": {"explicit": 0, "implicit": 0}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 1}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\battention mechanism\\b", "\\battention\\b"], "implicit_patterns": ["\\bmost relevant\\b", "\\brelevant chunks\\b"]}, {"term": "Next-token prediction", "explicit_total": 1, "implicit_total": 2, "sections_used": 2, "by_section": {"Introduction": {"explicit": 1, "implicit": 1}, "1 Coding assistants": {"explicit": 0, "implicit": 0}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 0}, "5 Agentic SDLC": {"explicit": 0, "implicit": 1}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\bnext-token prediction\\b"], "implicit_patterns": ["\\bpredict\\w*", "\\bstatistically continues\\b", "\\bcontinues? a sequence\\b"]}, {"term": "Context window", "explicit_total": 3, "implicit_total": 5, "sections_used": 7, "by_section": {"Introduction": {"explicit": 0, "implicit": 1}, "1 Coding assistants": {"explicit": 1, "implicit": 1}, "2 Test generation": {"explicit": 0, "implicit": 1}, "3 Logs & debugging": {"explicit": 1, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 1}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 1, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 1}}, "explicit_patterns": ["\\bcontext windows?\\b"], "implicit_patterns": ["\\bcontext\\b", "\\bshort-term memory\\b", "\\bfits? into\\b"]}, {"term": "Prompt", "explicit_total": 2, "implicit_total": 3, "sections_used": 4, "by_section": {"Introduction": {"explicit": 1, "implicit": 0}, "1 Coding assistants": {"explicit": 0, "implicit": 1}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 1, "implicit": 1}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 1}}, "explicit_patterns": ["\\bprompts?\\b"], "implicit_patterns": ["\\binstructions?\\b", "\\bquestions?\\b"]}, {"term": "AI agent", "explicit_total": 29, "implicit_total": 8, "sections_used": 8, "by_section": {"Introduction": {"explicit": 1, "implicit": 0}, "1 Coding assistants": {"explicit": 7, "implicit": 0}, "2 Test generation": {"explicit": 4, "implicit": 1}, "3 Logs & debugging": {"explicit": 3, "implicit": 1}, "4 RAG": {"explicit": 2, "implicit": 0}, "5 Agentic SDLC": {"explicit": 8, "implicit": 4}, "6 Small & local LLMs": {"explicit": 2, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 2, "implicit": 2}}, "explicit_patterns": ["\\bAI agents?\\b", "\\bsub-agents?\\b", "\\bagents?\\b"], "implicit_patterns": ["\\bautonomous(?:ly)?\\b", "\\bdelegat\\w*"]}, {"term": "Agentic platform", "explicit_total": 2, "implicit_total": 1, "sections_used": 1, "by_section": {"Introduction": {"explicit": 0, "implicit": 0}, "1 Coding assistants": {"explicit": 0, "implicit": 0}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 0}, "5 Agentic SDLC": {"explicit": 2, "implicit": 1}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\bagentic platforms?\\b"], "implicit_patterns": ["\\borchestrat\\w*", "\\bmulti-agent\\b"]}, {"term": "Copilot", "explicit_total": 6, "implicit_total": 3, "sections_used": 4, "by_section": {"Introduction": {"explicit": 1, "implicit": 1}, "1 Coding assistants": {"explicit": 2, "implicit": 1}, "2 Test generation": {"explicit": 1, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 0}, "5 Agentic SDLC": {"explicit": 2, "implicit": 1}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\bcopilots?\\b"], "implicit_patterns": ["\\bplugin\\b", "\\bcompanion\\b", "\\bIDE extension\\b", "\\binside an IDE\\b", "\\bexisting IDE\\b"]}, {"term": "AI-native IDE", "explicit_total": 3, "implicit_total": 4, "sections_used": 1, "by_section": {"Introduction": {"explicit": 0, "implicit": 0}, "1 Coding assistants": {"explicit": 3, "implicit": 4}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 0}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\bAI-native IDEs?\\b", "\\bAI-native\\b"], "implicit_patterns": ["\\bcode editor\\b", "\\bCursor\\b", "\\bWindsurf\\b", "\\bDevin Desktop\\b"]}, {"term": "Vibe coding", "explicit_total": 1, "implicit_total": 1, "sections_used": 1, "by_section": {"Introduction": {"explicit": 0, "implicit": 0}, "1 Coding assistants": {"explicit": 1, "implicit": 1}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 0}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\bvibe coding\\b"], "implicit_patterns": ["\\bnatural[- ]language\\b"]}, {"term": "Prompt injection", "explicit_total": 1, "implicit_total": 0, "sections_used": 1, "by_section": {"Introduction": {"explicit": 0, "implicit": 0}, "1 Coding assistants": {"explicit": 0, "implicit": 0}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 0}, "4 RAG": {"explicit": 0, "implicit": 0}, "5 Agentic SDLC": {"explicit": 1, "implicit": 0}, "6 Small & local LLMs": {"explicit": 0, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 0}, "Summary": {"explicit": 0, "implicit": 0}}, "explicit_patterns": ["\\bprompt injection\\b"], "implicit_patterns": ["\\bhidden commands\\b", "\\bmalicious instructions\\b", "\\buntrusted input\\b"]}, {"term": "Hallucination", "explicit_total": 5, "implicit_total": 5, "sections_used": 7, "by_section": {"Introduction": {"explicit": 1, "implicit": 1}, "1 Coding assistants": {"explicit": 1, "implicit": 1}, "2 Test generation": {"explicit": 0, "implicit": 0}, "3 Logs & debugging": {"explicit": 0, "implicit": 1}, "4 RAG": {"explicit": 1, "implicit": 1}, "5 Agentic SDLC": {"explicit": 0, "implicit": 0}, "6 Small & local LLMs": {"explicit": 1, "implicit": 0}, "7 Multimodal": {"explicit": 0, "implicit": 1}, "Summary": {"explicit": 1, "implicit": 0}}, "explicit_patterns": ["\\bhallucinat\\w*"], "implicit_patterns": ["\\bconvincing\\b", "\\bconfident but wrong\\b", "\\bfluent answer\\b", "\\bwrong conclusions\\b", "\\bgarble\\w*", "\\bcompiles but breaks\\b"]}]};
const svg = document.getElementById('graph');
const NS = 'http://www.w3.org/2000/svg';
const W = 1000, rowT = 44, top = 50;
const H = top + Math.max(DATA.terms.length, DATA.sections.length) * rowT + 10;
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const xT = 330, xS = 700;
const yT = i => top + i * (rowT * (Math.max(DATA.terms.length, DATA.sections.length) - 1) / (DATA.terms.length - 1));
const yS = i => top + i * (rowT * (Math.max(DATA.terms.length, DATA.sections.length) - 1) / (DATA.sections.length - 1));
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const maxW = Math.max(...DATA.terms.flatMap(t => Object.values(t.by_section).flatMap(v => [v.explicit, v.implicit])));
const maxTot = Math.max(...DATA.terms.map(t => t.explicit_total + t.implicit_total));
const tip = document.getElementById('tip');

el('text', {x: xT, y: 20, 'text-anchor': 'end', class: 'muted'}).textContent = 'Vocabulary term';
el('text', {x: xS, y: 20, class: 'muted'}).textContent = 'Report section';

const edges = el('g', {});
DATA.terms.forEach((t, i) => {
  DATA.sections.forEach((s, j) => {
    const v = t.by_section[s];
    [['explicit', -2], ['implicit', 2]].forEach(([kind, off]) => {
      if (!v[kind]) return;
      const y1 = yT(i) + off, y2 = yS(j) + off, mx = (xT + xS) / 2;
      el('path', {d: `M${xT + 12},${y1} C${mx},${y1} ${mx},${y2} ${xS - 12},${y2}`,
        class: `edge ${kind}`, 'stroke-width': 1 + 4 * v[kind] / maxW,
        'data-term': t.term, 'data-section': s}, edges);
    });
  });
});

function show(evt, html) { tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(evt.clientX + 14, innerWidth - 300) + 'px'; tip.style.top = (evt.clientY + 14) + 'px'; }
function hide() { tip.style.display = 'none'; svg.classList.remove('dim');
  svg.querySelectorAll('.on').forEach(e => e.classList.remove('on')); }
function focus(attr, value) { svg.classList.add('dim');
  svg.querySelectorAll(`.edge[data-${attr}="${CSS.escape(value)}"]`).forEach(e => { e.classList.add('on');
    svg.querySelectorAll(`.node[data-key="${CSS.escape(attr === 'term' ? e.dataset.section : e.dataset.term)}"]`).forEach(n => n.classList.add('on')); });
  svg.querySelectorAll(`.node[data-key="${CSS.escape(value)}"]`).forEach(n => n.classList.add('on')); }
const sw = c => `<span class="sw" style="background:var(--${c})"></span>`;

DATA.terms.forEach((t, i) => {
  const g = el('g', {class: 'node', 'data-key': t.term});
  const r = 5 + 9 * Math.sqrt((t.explicit_total + t.implicit_total) / maxTot);
  el('circle', {cx: xT, cy: yT(i), r, fill: 'var(--node)', stroke: 'var(--surface-1)', 'stroke-width': 2}, g);
  el('text', {x: xT - r - 8, y: yT(i) + 4, 'text-anchor': 'end'}, g).textContent =
    `${t.term}  (${t.explicit_total} / ${t.implicit_total})`;
  const hit = el('rect', {x: 0, y: yT(i) - rowT / 2, width: xT + 20, height: rowT, class: 'hit'}, g);
  hit.addEventListener('mousemove', e => { focus('term', t.term);
    const rows = DATA.sections.filter(s => t.by_section[s].explicit + t.by_section[s].implicit)
      .map(s => `${s}: ${t.by_section[s].explicit} / ${t.by_section[s].implicit}`).join('<br>') || 'not used';
    show(e, `<b>${t.term}</b>${sw('explicit')}Explicit: ${t.explicit_total}<br>${sw('implicit')}Implicit: ${t.implicit_total}<br><br>${rows}`); });
  hit.addEventListener('mouseleave', hide);
});
DATA.sections.forEach((s, j) => {
  const g = el('g', {class: 'node', 'data-key': s});
  el('rect', {x: xS - 6, y: yS(j) - 6, width: 12, height: 12, rx: 2, fill: 'var(--section)'}, g);
  el('text', {x: xS + 14, y: yS(j) + 4}, g).textContent = s;
  const hit = el('rect', {x: xS - 20, y: yS(j) - rowT / 2, width: W - xS + 20, height: rowT, class: 'hit'}, g);
  hit.addEventListener('mousemove', e => { focus('section', s);
    const rows = DATA.terms.filter(t => t.by_section[s].explicit + t.by_section[s].implicit)
      .map(t => `${t.term}: ${t.by_section[s].explicit} / ${t.by_section[s].implicit}`).join('<br>');
    show(e, `<b>${s}</b>term: explicit / implicit<br>${rows}`); });
  hit.addEventListener('mouseleave', hide);
});

document.querySelectorAll('.controls button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.controls button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const m = b.dataset.mode;
  svg.querySelectorAll('.edge.explicit').forEach(e => e.style.display = m === 'implicit' ? 'none' : '');
  svg.querySelectorAll('.edge.implicit').forEach(e => e.style.display = m === 'explicit' ? 'none' : '');
}));

const table = document.getElementById('table');
table.innerHTML = '<tr><th>Term</th><th>Explicit</th><th>Implicit</th><th>Sections used</th></tr>' +
  DATA.terms.map(t => `<tr><td>${t.term}</td><td>${t.explicit_total}</td><td>${t.implicit_total}</td><td>${t.sections_used} / ${DATA.sections.length}</td></tr>`).join('');
})();
</script>
</body>
</html>
